[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easynet"
version = "0.1.0"
description = "Network censorship bypass research tool for controlled lab environments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research Lab"}]

dependencies = [
    "scapy>=2.5.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
web = ["aiohttp-jinja2>=1.6", "jinja2>=3.1.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-mock>=3.12.0", "ruff>=0.1.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
easynet = "easynet.cli.main:cli"

[tool.setuptools.packages.find]
include = ["easynet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
